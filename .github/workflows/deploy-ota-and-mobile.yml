name: Heavenly Zemma CI/CD & OTA Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # Job 1: Build Web Bundle & Publish Capgo Over-the-Air (OTA) Live Update
  deploy-ota:
    name: Build Web & Publish OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ezelziniylvkzffuxvzc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_secret_IURLJu03OzeTDAtItMRk0Q_ukbi5GxE' }}
        run: npm run build

      - name: Upload Capgo OTA Live Update
        if: github.ref == 'refs/heads/main'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -n "$CAPGO_TOKEN" ]; then
            npx @capgo/cli@latest bundle upload \
              --apikey "$CAPGO_TOKEN" \
              --app-id com.heavenlyzemma.app \
              --channel production \
              --path dist
            echo "OTA bundle published successfully to production channel."
          else
            echo "CAPGO_TOKEN not set; skipping remote upload."
          fi

      - name: Archive Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heavenly-zemma-dist
          path: dist/
          retention-days: 7

  # Job 2: Build Signed Android APK & AAB (Runs on version tags e.g. v1.0.0)
  build-android:
    name: Build Signed Android Release (AAB & APK)
    needs: deploy-ota
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Setup Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Release APK & Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

  # Job 3: Build iOS Project & Archive (Runs on macOS for version tags)
  build-ios:
    name: Build iOS Archive & Export
    needs: deploy-ota
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Setup Capacitor iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Prepare Xcode Archive
        run: |
          echo "iOS Xcode workspace generated at ios/App/App.xcworkspace."
          # xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release archive -archivePath build/App.xcarchive
